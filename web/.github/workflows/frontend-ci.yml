name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "artifacts/transit-eticket/**"
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: |
          cd artifacts/transit-eticket
          pnpm install

      - name: Run tests
        run: |
          cd artifacts/transit-eticket
          pnpm test

      - name: Build
        run: |
          cd artifacts/transit-eticket
          pnpm build

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./artifacts/transit-eticket/coverage/coverage-final.json
          flags: frontend

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - run: |
          cd artifacts/transit-eticket
          pnpm install
          pnpm typecheck
